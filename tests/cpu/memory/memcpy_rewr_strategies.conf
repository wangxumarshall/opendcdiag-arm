# ---------------------------------------------------------------------------
# memcpy_rewr strategy configuration
# ---------------------------------------------------------------------------
# '#' begins a comment. Blank lines are ignored. A line "[strategy: name]"
# opens a new strategy block; "key = value" lines add parameters to the
# currently-open block. Pick a strategy at run time with the environment
# variable SANDSTONE_STRATEGY_INDEX (0-based; out-of-range wraps modulo
# the block count, giving round-robin coverage when the test is invoked
# repeatedly). Override this file with SANDSTONE_STRATEGY_CONF=<path>.
#
# role_rule values (interpreted by memcpy_rewr.cpp):
#   numa_split             - producer if the CPU's NUMA id is in the lower
#                            half of the visible NUMA-id set, consumer
#                            otherwise. On a 2-NUMA-node machine this is
#                            "node0 produces, node1 consumes" so every
#                            byte crosses the cross-die coherence fabric.
#   die_even_odd           - intra-die brawl: split each Die (a.k.a. Linux
#                            cluster / module_id, 4 cores each) into
#                            even-core_id producers and odd-core_id
#                            consumers so the brawl stays inside one L3
#                            slice / ring-bus domain. (On Kunpeng 920 sysfs
#                            topology/die_id is -1, so module_id is used.)
#   first_n_producers      - the first producer_count CPUs (in device_info
#                            order) produce; the rest consume. One writer,
#                            many readers, to provoke a snoop/invalidate
#                            storm against the directory controller.
#
# block_size : per-transfer payload size in bytes (fills b1..b5 of the
#              mem_info_s struct and the scratch m_tmp buffer).
# ---------------------------------------------------------------------------

[strategy: numa_cross_node]
# Strategy 1: NUMA cross-node barrage.
# Node 0 (producer) -> Node 1 (consumer). All data movement must traverse
# the cross-die high-speed cache-coherence fabric (e.g. HiSilicon HHA /
# Kunpeng mesh), stressing signal-integrity and timing of the interconnect.
role_rule = numa_split
block_size = 65536

[strategy: same_die_l3_brawl]
# Strategy 2: intra-die L3 / ring-bus brawl.
# Split each Die (module_id/cluster_id, 4 cores each) into even/odd core_id
# producers vs consumers, so all coherence traffic stays inside one L3 slice
# and its ring bus.
role_rule = die_even_odd
block_size = 65536

[strategy: few_producer_many_consumer_storm]
# Strategy 3: single-producer / many-consumer invalidate storm.
# A handful of producers write the shared line; the many consumers snoop,
# forcing broadcast Invalidate traffic that taxes the directory controller.
# Example on a 48-core box: producers 0..3, consumers 4..47.
role_rule = first_n_producers
producer_count = 4
block_size = 65536
